# ==============================================================================
# Absolute Store - Supervisor Process Manager Configuration
# Manages: Redis Queue Workers, Laravel Scheduler, & Reverb WebSocket Server
# File path on server: /etc/supervisor/conf.d/absolute_store.conf
# ==============================================================================

# 1. Background Queue Worker (Redis)
[program:absolute-store-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/absolute-store/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/absolute-store/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600

# 2. Automated Task Scheduler (Cron Alternative Daemon)
[program:absolute-store-scheduler]
process_name=%(program_name)s
command=php /var/www/absolute-store/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/absolute-store/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

# 3. Laravel Reverb WebSocket Server (Real-Time Events)
[program:absolute-store-reverb]
process_name=%(program_name)s
command=php /var/www/absolute-store/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/absolute-store/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
